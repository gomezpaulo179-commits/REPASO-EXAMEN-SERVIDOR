<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="camposFiltro" class="row g-2 align-items-start mt-1">
  <div class="col-md-4">
    <label for="titulo" class="form-label">Título</label>
    <input type="text" th:field="*{titulo}" class="form-control">
  </div>
  <div class="col-md-2">
    <label for="limite" class="form-label">Mostrar</label>
    <input type="text" inputmode="numeric" th:field="*{limite}" class="form-control"
           th:classappend="${#fields.hasErrors('limite')} ? 'is-invalid'">
    <div class="invalid-feedback" th:errors="*{limite}">Error</div>
  </div>
  <div class="col-md-3">
    <label for="orden" class="form-label">Ordenar por</label>
    <select th:field="*{orden}" class="form-select">
      <option value="fecha">Fecha</option>
      <option value="titulo">Título</option>
    </select>
  </div>
  <div class="col-md-3 d-flex align-items-center" style="padding-top: 2rem;">
    <div class="form-check">
      <input type="checkbox" th:field="*{soloClasicos}" class="form-check-input">
      <label class="form-check-label" th:for="${#ids.prev('soloClasicos')}">
        Solo clásicos
      </label>
    </div>
  </div>
</div>

</body>
</html>
